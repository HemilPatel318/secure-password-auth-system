<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fbfc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9fb2bf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2c5f7a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #5a7181; }
      .layer-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #304b5c; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #456171; }
      .label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .chip { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="700" y="70" text-anchor="middle" class="title">SecureAuthProject - System Architecture</text>
  <text x="700" y="105" text-anchor="middle" class="subtitle">A clean layered design for secure authentication and session control</text>
  <rect x="120" y="160" rx="28" ry="28" width="1160" height="120" fill="#1f6f8b" filter="url(#shadow)"/>
  <text x="700" y="210" text-anchor="middle" class="label">Presentation Layer</text>
  <text x="700" y="245" text-anchor="middle" class="chip">Register Page   |   Login Page   |   OTP Verification   |   Dashboard   |   Logout</text>
  <rect x="120" y="320" rx="28" ry="28" width="1160" height="140" fill="url(#card)" stroke="#d7e2e8" filter="url(#shadow)"/>
  <text x="700" y="365" text-anchor="middle" class="layer-title">Application Layer</text>
  <text x="700" y="400" text-anchor="middle" class="body">Flask App Factory, Routes, Request Handling, Flash Messages, Redirects</text>
  <text x="700" y="430" text-anchor="middle" class="small">Coordinates the full authentication flow and connects UI with backend services</text>
  <rect x="120" y="500" rx="28" ry="28" width="540" height="190" fill="url(#card)" stroke="#d7e2e8" filter="url(#shadow)"/>
  <text x="390" y="545" text-anchor="middle" class="layer-title">Authentication Layer</text>
  <text x="170" y="590" class="body">- Password hash verification with bcrypt</text>
  <text x="170" y="625" class="body">- OTP generation and validation</text>
  <text x="170" y="660" class="body">- MFA completion and session creation</text>
  <rect x="740" y="500" rx="28" ry="28" width="540" height="190" fill="url(#card)" stroke="#d7e2e8" filter="url(#shadow)"/>
  <text x="1010" y="545" text-anchor="middle" class="layer-title">Security Layer</text>
  <text x="790" y="590" class="body">- Password policy enforcement</text>
  <text x="790" y="625" class="body">- Failed-attempt tracking and lockout</text>
  <text x="790" y="660" class="body">- Secure cookies and session timeout</text>
  <rect x="290" y="740" rx="28" ry="28" width="820" height="110" fill="#2c5f7a" filter="url(#shadow)"/>
  <text x="700" y="785" text-anchor="middle" class="label">Data Layer</text>
  <text x="700" y="820" text-anchor="middle" class="chip">SQLite Database: Users, Password Hashes, OTP Challenges, Failed Attempts, Lock Status</text>
  <line x1="700" y1="280" x2="700" y2="320" stroke="#2c5f7a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="470" y1="460" x2="470" y2="500" stroke="#2c5f7a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="930" y1="460" x2="930" y2="500" stroke="#2c5f7a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="470" y1="690" x2="470" y2="740" stroke="#2c5f7a" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="930" y1="690" x2="930" y2="740" stroke="#2c5f7a" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
