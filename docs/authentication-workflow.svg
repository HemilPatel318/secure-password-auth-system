<svg width="1400" height="950" viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="step" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafbfc"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9fb2bf" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b85c38"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #5a7181; }
      .step-title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .body { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #304b5c; }
      .pill { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .decision { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #163447; }
      .path { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #b85c38; }
    </style>
  </defs>
  <rect width="1400" height="950" fill="url(#bg2)"/>
  <text x="700" y="70" text-anchor="middle" class="title">SecureAuthProject - Authentication Workflow</text>
  <text x="700" y="105" text-anchor="middle" class="subtitle">Clean MFA flow with password check, OTP validation, and timed session management</text>
  <rect x="535" y="145" rx="24" ry="24" width="330" height="85" fill="#b85c38" filter="url(#shadow2)"/>
  <text x="700" y="197" text-anchor="middle" class="pill">1. User Enters Email and Password</text>
  <rect x="505" y="275" rx="24" ry="24" width="390" height="95" fill="url(#step)" stroke="#dfddd7" filter="url(#shadow2)"/>
  <text x="700" y="320" text-anchor="middle" class="step-title">2. System Verifies Password</text>
  <text x="700" y="350" text-anchor="middle" class="body">bcrypt compares entered password with stored hash</text>
  <polygon points="700,425 850,515 700,605 550,515" fill="#fff7f2" stroke="#d5b9ab" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="700" y="508" text-anchor="middle" class="decision">Valid</text>
  <text x="700" y="536" text-anchor="middle" class="decision">Credentials?</text>
  <rect x="980" y="470" rx="24" ry="24" width="260" height="90" fill="#fff1ed" stroke="#e0b8aa" filter="url(#shadow2)"/>
  <text x="1110" y="512" text-anchor="middle" class="step-title">Reject Login</text>
  <text x="1110" y="542" text-anchor="middle" class="body">Track failed attempts</text>
  <rect x="505" y="655" rx="24" ry="24" width="390" height="95" fill="url(#step)" stroke="#dfddd7" filter="url(#shadow2)"/>
  <text x="700" y="700" text-anchor="middle" class="step-title">3. Generate OTP Challenge</text>
  <text x="700" y="730" text-anchor="middle" class="body">Create a 60-second OTP and store challenge details</text>
  <rect x="505" y="790" rx="24" ry="24" width="390" height="95" fill="url(#step)" stroke="#dfddd7" filter="url(#shadow2)"/>
  <text x="700" y="835" text-anchor="middle" class="step-title">4. User Enters OTP</text>
  <text x="700" y="865" text-anchor="middle" class="body">System checks OTP value and expiry time</text>
  <rect x="1010" y="785" rx="24" ry="24" width="250" height="100" fill="#fff1ed" stroke="#e0b8aa" filter="url(#shadow2)"/>
  <text x="1135" y="828" text-anchor="middle" class="step-title">OTP Invalid or Expired</text>
  <text x="1135" y="858" text-anchor="middle" class="body">Restart login process</text>
  <rect x="140" y="785" rx="24" ry="24" width="250" height="100" fill="#eef8f0" stroke="#b8d7c0" filter="url(#shadow2)"/>
  <text x="265" y="828" text-anchor="middle" class="step-title">OTP Valid</text>
  <text x="265" y="858" text-anchor="middle" class="body">Continue to session creation</text>
  <rect x="140" y="620" rx="24" ry="24" width="250" height="100" fill="#1f6f8b" filter="url(#shadow2)"/>
  <text x="265" y="675" text-anchor="middle" class="pill">5. Create Session and Open Dashboard</text>
  <rect x="140" y="455" rx="24" ry="24" width="250" height="100" fill="#f5f9fc" stroke="#d5e0e8" filter="url(#shadow2)"/>
  <text x="265" y="498" text-anchor="middle" class="step-title">6. Session Timeout</text>
  <text x="265" y="528" text-anchor="middle" class="body">Auto logout after inactivity</text>
  <line x1="700" y1="230" x2="700" y2="275" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="370" x2="700" y2="425" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="850" y1="515" x2="980" y2="515" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="605" x2="700" y2="655" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="750" x2="700" y2="790" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="505" y1="838" x2="390" y2="838" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="895" y1="838" x2="1010" y2="838" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="265" y1="785" x2="265" y2="720" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <line x1="265" y1="620" x2="265" y2="555" stroke="#b85c38" stroke-width="5" marker-end="url(#arrow2)"/>
  <text x="892" y="498" class="path">No</text>
  <text x="720" y="640" class="path">Yes</text>
  <text x="425" y="825" class="path">Valid</text>
  <text x="915" y="825" class="path">Invalid</text>
</svg>
